# 角色 → 技能映射表
# Team Creator 使用此文件为 agent 推荐技能

# ============================================
# 通用基础技能（所有 agent 都应具备）
# ============================================
universal:
  required:
    - openclaw              # 平台基础
    - writing-plans         # 计划编写
    - executing-plans       # 计划执行
    - verification-before-completion  # 完成验证
  optional:
    - session-handoff       # 会话交接
    - brainstorming         # 头脑风暴

